# Mailcatcher só para a demo: é o contact point de e-mail do Grafana unified
# alerting (ver kube-prometheus-stack.grafana.alerting/grafana.ini.smtp em
# values.yaml). Não é infra real — é o mesmo papel que ele já cumpre no
# docker-compose local.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailcatcher
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mailcatcher
    app.kubernetes.io/part-of: bunzina-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailcatcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailcatcher
    spec:
      containers:
        - name: mailcatcher
          image: sj26/mailcatcher
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 1080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mailcatcher
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mailcatcher
    app.kubernetes.io/part-of: bunzina-observability
spec:
  selector:
    app.kubernetes.io/name: mailcatcher
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: http
      port: 1080
      targetPort: http
