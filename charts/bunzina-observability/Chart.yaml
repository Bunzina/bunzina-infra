apiVersion: v2
name: bunzina-observability
description: Stack de observabilidade do Bunzina — Prometheus, Grafana, Loki, Tempo e Alloy
type: application
version: 0.1.0
appVersion: "1.0.0"
dependencies:
  - name: kube-prometheus-stack
    version: "90.0.0"
    repository: "https://prometheus-community.github.io/helm-charts"
  - name: loki
    version: "7.3.0"
    repository: "https://grafana.github.io/helm-charts"
  - name: tempo
    version: "2.3.0"
    repository: "https://grafana-community.github.io/helm-charts"
  # Alloy sobe duas vezes na mesma release: DaemonSet para logs dos pods e
  # Deployment como gateway OTLP para traces. `controller.type` é um valor por
  # release do chart, então precisamos de dois dependencies com alias.
  - name: alloy
    version: "1.12.1"
    alias: alloy-logs
    repository: "https://grafana.github.io/helm-charts"
  - name: alloy
    version: "1.12.1"
    alias: alloy-gateway
    repository: "https://grafana.github.io/helm-charts"
