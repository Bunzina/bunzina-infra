{{- $password := required "auth.password is required" .Values.auth.password -}}
{{- $vhost := .Values.topology.vhost -}}
{{- $exchange := .Values.topology.exchange -}}
{{- $dlx := printf "%s.dlx" $exchange -}}
{{- $exchanges := list -}}
{{- $queues := list -}}
{{- $bindings := list -}}

{{- range $name := list $exchange $dlx -}}
{{- $exchanges = append $exchanges (dict "name" $name "vhost" $vhost "type" "topic" "durable" true "auto_delete" false "internal" false "arguments" (dict)) -}}
{{- end -}}

{{- range $q := .Values.topology.queues -}}
{{- $dlq := printf "%s.dlq" $q.name -}}
{{- $queues = append $queues (dict "name" $q.name "vhost" $vhost "durable" true "auto_delete" false "arguments" (dict "x-dead-letter-exchange" $dlx)) -}}
{{- $queues = append $queues (dict "name" $dlq "vhost" $vhost "durable" true "auto_delete" false "arguments" (dict)) -}}
{{- $bindings = append $bindings (dict "source" $dlx "vhost" $vhost "destination" $dlq "destination_type" "queue" "routing_key" "#" "arguments" (dict)) -}}
{{- range $key := $q.bindings -}}
{{- $bindings = append $bindings (dict "source" $exchange "vhost" $vhost "destination" $q.name "destination_type" "queue" "routing_key" $key "arguments" (dict)) -}}
{{- end -}}
{{- end -}}

{{- /*
  Com `load_definitions` o RabbitMQ não cria o vhost nem o usuário padrão
  ("Will not seed default virtual host and user: have definitions to load"),
  então ambos entram aqui. As definitions carregam a senha e por isso moram
  no Secret, não no ConfigMap.
*/ -}}
{{- $definitions := dict
  "vhosts" (list (dict "name" $vhost))
  "users" (list (dict "name" .Values.auth.username "password" $password "tags" "administrator"))
  "permissions" (list (dict "user" .Values.auth.username "vhost" $vhost "configure" ".*" "write" ".*" "read" ".*"))
  "exchanges" $exchanges
  "queues" $queues
  "bindings" $bindings -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-definitions
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  definitions.json: |
{{ $definitions | toPrettyJson | indent 4 }}
