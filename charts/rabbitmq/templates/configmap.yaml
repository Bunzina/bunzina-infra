apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_prometheus].
  90-bunzina.conf: |
    load_definitions = /etc/rabbitmq/definitions.json
