name: Notify Discord on PR to Main

on:
  pull_request:
    types: [opened]
    branches:
      - main

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send message to Discord
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "embeds": [
              {
                "title": "🚀 Novo Pull Request para main",
                "url": "${{ github.event.pull_request.html_url }}",
                "color": 5814783,
                "author": {
                  "name": "${{ github.event.pull_request.user.login }}",
                  "icon_url": "${{ github.event.pull_request.user.avatar_url }}"
                },
                "description": "${{ github.event.pull_request.title }}",
                "fields": [
                  {
                    "name": "🌿 Branch",
                    "value": "${{ github.event.pull_request.head.ref }} → ${{ github.event.pull_request.base.ref }}",
                    "inline": true
                  },
                  {
                    "name": "📦 Repositório",
                    "value": "${{ github.repository }}",
                    "inline": true
                  }
                ],
                "footer": {
                  "text": "GitHub PR Notification"
                },
                "timestamp": "${{ github.event.pull_request.created_at }}"
              }
            ]
          }' \
          ${{ secrets.DISCORD_WEBHOOK }}
